<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shelf — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login">
    <section class="login-art" aria-hidden="true">
      <div class="spines">
        <i style="--h:62%;--c:#0E7C7B"></i><i style="--h:80%;--c:#C98A1B"></i><i style="--h:54%;--c:#B3372F"></i>
        <i style="--h:92%;--c:#2F5D8A"></i><i style="--h:70%;--c:#0E7C7B"></i><i style="--h:86%;--c:#6B4E9B"></i>
        <i style="--h:58%;--c:#C98A1B"></i><i style="--h:76%;--c:#2F5D8A"></i><i style="--h:66%;--c:#B3372F"></i>
        <i style="--h:90%;--c:#0E7C7B"></i><i style="--h:60%;--c:#6B4E9B"></i>
      </div>
      <p class="shelf-line"></p>
    </section>

    <section class="login-panel">
      <h1>Shelf</h1>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="signin" role="tab">Sign in</button>
        <button type="button" class="tab" data-tab="signup" role="tab">Create account</button>
      </div>

      <p id="auth-error" class="error" role="alert"></p>

      <form id="signin-form" class="form">
        <label>Email<input type="email" name="email" required autocomplete="username" /></label>
        <label>Password<input type="password" name="password" required autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>

      <form id="signup-form" class="form" hidden>
        <label>Full name<input name="name" required autocomplete="name" /></label>
        <label>Email<input type="email" name="email" required autocomplete="email" /></label>
        <label>Password<input type="password" name="password" minlength="6" required autocomplete="new-password" /></label>
        <label>Confirm password<input type="password" name="confirm" minlength="6" required autocomplete="new-password" /></label>
        <button class="btn primary" type="submit">Create student account</button>
        <p class="muted small">Staff accounts are added by a library admin.</p>
      </form>

      <div class="divider"><span>or</span></div>
      <a class="btn google" href="/api/auth/google"><span class="g-mark">G</span>Continue with Google</a>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shelf — Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Shelf</div>
      <nav id="nav">
        <button data-view="catalogue" class="active">Find books</button>
        <button data-view="loans">My loans</button>
      </nav>
      <div class="user">
        <span id="user-name"></span>
        <small id="member-id" class="role-tag"></small>
        <button id="change-password" class="link">Change password</button>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main class="content">
      <header class="topbar"><h2 id="view-title">Find books</h2></header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" class="form">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <p id="modal-error" class="error" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="modal-submit">Save</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/common.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
